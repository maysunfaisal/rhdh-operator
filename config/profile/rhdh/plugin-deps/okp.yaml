# OKP (Offline Knowledge Portal) standalone Deployment.
# name/labels/selector are set by the operator at runtime (per Backstage CR); the values
# below are placeholders. The image ref is intentionally declared here (not in Go source)
# so midstream digest-pinning can resolve it in the generated bundle ConfigMap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightspeed-okp-{{backstage-name}}
  annotations:
    rhdh.redhat.com/platform: '{{if eq .Platform.Extension "ocp"}}ocp{{else if pluginDependencyEnabled "okp"}}k8s{{else}}disabled{{end}}'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lightspeed-okp-{{backstage-name}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lightspeed-okp-{{backstage-name}}
    spec:
      # OKP serves docs (Solr + httpd) and needs no Kubernetes API access.
      automountServiceAccountToken: false
      containers:
        - name: okp
          image: registry.redhat.io/offline-knowledge-portal/rhokp-rhel9:1.2.10-1786628394
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
{{if eq .Platform.Extension "k8s"}}
            runAsUser: 1001
{{end}}
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: httpd
              containerPort: 8080
              protocol: TCP
            - name: solr
              containerPort: 8983
              protocol: TCP
          env:
            - name: SOLR_JAVA_MEM
              value: "-Xms1g -Xmx1g"
            - name: SOLR_HOST_BIND
              value: "0.0.0.0"
            # The OKP image's httpd config reads these exact names
            # (config/httpd conf.d: ServerName ${MIMIR_HTTPD_SERVER_NAME},
            # Define compressed_${COMPRESSED}_encrypt_${ENCRYPT}); the
            # HTTPD_-prefixed names are ignored. Matches rhdh-chart.
            - name: MIMIR_HTTPD_SERVER_NAME
              value: "localhost"
            - name: COMPRESSED
              value: "true"
            - name: ENCRYPT
              value: "false"
          resources:
            requests:
              cpu: 200m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
---
# OKP (Offline Knowledge Portal) standalone OpenShift Route.
# name/labels and spec.to.name are set by the operator at runtime (per Backstage CR).
# Applied on OpenShift only.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: lightspeed-okp-{{backstage-name}}
  annotations:
    rhdh.redhat.com/platform: "ocp"
spec:
  to:
    kind: Service
    name: lightspeed-okp-{{backstage-name}}
  port:
    targetPort: httpd
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Allow
---
# OKP (Offline Knowledge Portal) standalone ClusterIP Service.
# name/labels/selector are set by the operator at runtime (per Backstage CR).
apiVersion: v1
kind: Service
metadata:
  name: lightspeed-okp-{{backstage-name}}
  annotations:
    rhdh.redhat.com/platform: '{{if eq .Platform.Extension "ocp"}}ocp{{else if pluginDependencyEnabled "okp"}}k8s{{else}}disabled{{end}}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lightspeed-okp-{{backstage-name}}
  ports:
    - name: httpd
      port: 8080
      targetPort: httpd
      protocol: TCP
    - name: solr
      port: 8983
      targetPort: solr
      protocol: TCP
---
# OKP (Offline Knowledge Portal) standalone Kubernetes Ingress.
# The referenced plugin dependency ConfigMap provides the cluster-specific host and TLS settings.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lightspeed-okp-{{backstage-name}}
  annotations:
    rhdh.redhat.com/platform: '{{if and (eq .Platform.Extension "k8s") (pluginDependencyEnabled "okp")}}k8s{{else}}disabled{{end}}'
spec:
{{if pluginDependencyValue "okp" "OKP_INGRESS_CLASS_NAME"}}
  ingressClassName: {{quote (pluginDependencyValue "okp" "OKP_INGRESS_CLASS_NAME")}}
{{end}}
{{if isTrue (pluginDependencyValue "okp" "OKP_INGRESS_TLS_ENABLED")}}
  tls:
    - hosts:
        - {{quote (required "OKP_INGRESS_HOST is required when the okp plugin dependency ConfigMap is referenced" (pluginDependencyValue "okp" "OKP_INGRESS_HOST"))}}
{{if pluginDependencyValue "okp" "OKP_INGRESS_TLS_SECRET_NAME"}}
      secretName: {{quote (pluginDependencyValue "okp" "OKP_INGRESS_TLS_SECRET_NAME")}}
{{end}}
{{end}}
  rules:
    - host: {{if pluginDependencyEnabled "okp"}}{{quote (required "OKP_INGRESS_HOST is required when the okp plugin dependency ConfigMap is referenced" (pluginDependencyValue "okp" "OKP_INGRESS_HOST"))}}{{else}}"disabled.invalid"{{end}}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lightspeed-okp-{{backstage-name}}
                port:
                  name: httpd
