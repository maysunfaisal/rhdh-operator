apiVersion: apps/v1
kind: Deployment
spec:
  template:
    spec:
      containers:
        # Lightspeed Core Backend
        - name: lightspeed-core
          image: quay.io/lightspeed-core/lightspeed-stack:dev-20260811-0da4b12
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8080
              name: lcs-backend
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          args:
            - "--synthesized-config-output"
            - "/tmp/.generated/run.yaml"
          env:
{{if eq .Platform.Extension "ocp"}}
            # LCORE uses this URL both to query OKP and to construct browser-facing citation links.
            - name: OKP_SERVICE_URL
              value: "http://lightspeed-okp-{{.Backstage.Name}}-{{.Backstage.Namespace}}.{{.OpenShift.IngressDomain}}"
{{else if pluginDependencyEnabled "okp"}}
            # On Kubernetes, the referenced OKP dependency ConfigMap supplies the public Ingress host.
            - name: OKP_SERVICE_URL
              value: {{if isTrue (pluginDependencyValue "okp" "OKP_INGRESS_TLS_ENABLED")}}{{quote (printf "https://%s" (required "OKP_INGRESS_HOST is required when the okp plugin dependency ConfigMap is referenced" (pluginDependencyValue "okp" "OKP_INGRESS_HOST")))}}{{else}}{{quote (printf "http://%s" (required "OKP_INGRESS_HOST is required when the okp plugin dependency ConfigMap is referenced" (pluginDependencyValue "okp" "OKP_INGRESS_HOST")))}}{{end}}
{{end}}
            - name: HF_HOME
              value: /tmp/hf_cache
            - name: OTEL_SDK_DISABLED
              value: "true"
          volumeMounts:
            - mountPath: /tmp
              name: lightspeed-data

      volumes:
        - name: lightspeed-data
          emptyDir: { }
